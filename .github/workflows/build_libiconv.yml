name: 构建libiconv库
on:
  workflow_dispatch:
    inputs:
      commit:
        description: '选择一个目标项目的Commit, branch 或 tag来构建'
        required: false
        default: 'master'

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .
  release_name: libiconv
  release_version: 1.17

jobs:
  build_matrix:
    strategy:
      matrix:
        BUILD_CONFIGURATION: [Release]
        BUILD_PLATFORM: [x86]

    runs-on: windows-2022

    steps:
    - name: Get current date
      id: date
      run: |
        echo "::set-output name=today::$(date +'%Y-%m-%d')"

    - name: Clone
      uses: actions/checkout@v3
      with: 
        repository: kumor00/libiconv-for-Windows
        ref: ${{ github.event.inputs.commit }}

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.1
      with:
        # vs-prerelease: true
        msbuild-architecture: x64

    - name: Restore NuGet packages
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      # Add additional options to the MSBuild command line here (like platform or verbosity level).
      # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      run: |
        msbuild /m /p:Configuration=${{matrix.BUILD_CONFIGURATION}} /p:Platform=${{matrix.BUILD_PLATFORM}} ${{env.SOLUTION_FILE_PATH}}
        Compress-Archive ${{env.SOLUTION_FILE_PATH}}\output\Win32\Release\* ${{ env.release_name }}.zip

    - name: Upload
      uses: ncipollo/release-action@v1
      with:
        artifacts: "${{ env.release_name }}.zip"
        token: ${{ secrets.GITHUB_TOKEN }}
        name: ${{ env.release_name }}-${{ env.release_version }} # 版本的可选名称。如果省略，将使用标签。
        tag: ${{ env.release_name }}-${{ env.release_version }}
        draft: false  # 可选择将此版本标记为草稿版本。 设置为 true 以启用。
        allowUpdates: true
        replacesArtifacts: true
        body: "${{ env.release_name }}自动化构建发布包"